<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980"><rect width="1560" height="980" fill="#FFFFFF"/><text x="64" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#6B7688" text-anchor="start" letter-spacing="2.2">WHAT THE TOOL IS MADE OF</text><text x="64" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Passive capture in, cited findings out.</text><rect x="64" y="210" width="258" height="232" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="64" y="210" width="258" height="4" rx="2" fill="#1F8A8A"/><text x="88" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6B7688" text-anchor="start" letter-spacing="1.5">01</text><text x="88" y="302" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Capture</text><text x="88" y="338" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">pcap file</text><text x="88" y="363" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">no agent on</text><text x="88" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">the gateway</text><line x1="330" y1="326.0" x2="354" y2="326.0" stroke="#D9E0E8" stroke-width="1.5"/><path d="M 354 326.0 l -6 -4 l 0 8 z" fill="#D9E0E8"/><rect x="364" y="210" width="258" height="232" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="364" y="210" width="258" height="4" rx="2" fill="#0B1017"/><text x="388" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6B7688" text-anchor="start" letter-spacing="1.5">02</text><text x="388" y="302" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">CipherLens</text><text x="388" y="338" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">from-scratch IKEv1</text><text x="388" y="363" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">and IKEv2</text><text x="388" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">in Rust</text><line x1="630" y1="326.0" x2="654" y2="326.0" stroke="#D9E0E8" stroke-width="1.5"/><path d="M 654 326.0 l -6 -4 l 0 8 z" fill="#D9E0E8"/><rect x="664" y="210" width="258" height="232" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="664" y="210" width="258" height="4" rx="2" fill="#0B1017"/><text x="688" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6B7688" text-anchor="start" letter-spacing="1.5">03</text><text x="688" y="302" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">AttackMap</text><text x="688" y="338" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">rules against</text><text x="688" y="363" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">RFC 8247, 8221,</text><text x="688" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">SP 800-131A</text><line x1="930" y1="326.0" x2="954" y2="326.0" stroke="#D9E0E8" stroke-width="1.5"/><path d="M 954 326.0 l -6 -4 l 0 8 z" fill="#D9E0E8"/><rect x="964" y="210" width="258" height="232" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="964" y="210" width="258" height="4" rx="2" fill="#0B1017"/><text x="988" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6B7688" text-anchor="start" letter-spacing="1.5">04</text><text x="988" y="302" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Ledger</text><text x="988" y="338" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">packet number</text><text x="988" y="363" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">plus a SHA-256</text><text x="988" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">chain</text><line x1="1230" y1="326.0" x2="1254" y2="326.0" stroke="#D9E0E8" stroke-width="1.5"/><path d="M 1254 326.0 l -6 -4 l 0 8 z" fill="#D9E0E8"/><rect x="1264" y="210" width="258" height="232" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="1264" y="210" width="258" height="4" rx="2" fill="#1F8A8A"/><text x="1288" y="264" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#6B7688" text-anchor="start" letter-spacing="1.5">05</text><text x="1288" y="302" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Report</text><text x="1288" y="338" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">JSON, HTML, CBOM,</text><text x="1288" y="363" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">and the fix</text><text x="1288" y="388" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">to apply</text><rect x="64" y="512" width="1468" height="132" rx="4" fill="#F2F5F8"/><rect x="64" y="512" width="5" height="132" rx="0" fill="#D62B2B"/><text x="96" y="556" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Passive by construction</text><text x="96" y="590" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">No socket is opened, no key is read, no packet is written. There is no code path in the engine that could.</text><text x="96" y="616" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#6B7688" text-anchor="start" letter-spacing="0">Payload bytes are never copied out of the parser, so the tool cannot leak what it is not built to see.</text><text x="64" y="682" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#6B7688" text-anchor="start" letter-spacing="2.2">AND WHAT COMES OUT</text><rect x="64" y="704" width="464" height="168" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="64" y="704" width="464" height="4" rx="2" fill="#1F8A8A"/><text x="88" y="750" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Finding</text><text x="88" y="784" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">severity, the packet it was</text><text x="88" y="808" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">read from, the standard</text><text x="88" y="832" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">that makes it a finding</text><rect x="566" y="704" width="464" height="168" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="566" y="704" width="464" height="4" rx="2" fill="#B4761A"/><text x="590" y="750" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Grade</text><text x="590" y="784" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">one number, capped by the</text><text x="590" y="808" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">worst finding so a failing</text><text x="590" y="832" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">tunnel cannot read as passing</text><rect x="1068" y="704" width="464" height="168" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><rect x="1068" y="704" width="464" height="4" rx="2" fill="#D62B2B"/><text x="1092" y="750" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Fix</text><text x="1092" y="784" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">a configuration fragment</text><text x="1092" y="808" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">that changes what was</text><text x="1092" y="832" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">found, not a complaint</text><text x="64" y="930" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7688" text-anchor="start" letter-spacing="0">An unobserved field is reported as unobserved. It is never inferred from a configuration file the tool never saw.</text></svg>