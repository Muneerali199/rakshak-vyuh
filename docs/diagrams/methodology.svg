<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="980"><rect width="1560" height="980" fill="#FFFFFF"/><text x="64" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#6B7688" text-anchor="start" letter-spacing="2.2">WHY ANY OF IT CAN BE BELIEVED</text><text x="64" y="122" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">The parser is checked against something else.</text><rect x="64" y="208" width="1468" height="178" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><circle cx="112" cy="252" r="15" fill="#1F8A8A"/><path d="M 105 252 l 5 6 l 10 -12" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Ground truth is not us</text><text x="148" y="294" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">Every expectation in the corpus tests was read from tcpdump -nvv or swanctl</text><text x="148" y="319" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">--list-sas on the live gateway that produced the capture.</text><text x="148" y="356" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7688" text-anchor="start" letter-spacing="0">Parsed with the vendor's own tools, not with ours.</text><rect x="64" y="412" width="1468" height="178" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><circle cx="112" cy="456" r="15" fill="#1F8A8A"/><path d="M 105 456 l 5 6 l 10 -12" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="464" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Disagreement means the parser is wrong</text><text x="148" y="498" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">Where the analyser and tcpdump differed, tcpdump was treated as correct and</text><text x="148" y="523" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">the parser was fixed. Twice, on real captures.</text><text x="148" y="560" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7688" text-anchor="start" letter-spacing="0">This is how a dissector earns the right to be believed.</text><rect x="64" y="616" width="1468" height="178" rx="4" fill="#FFFFFF" stroke="#D9E0E8" stroke-width="1"/><circle cx="112" cy="660" r="15" fill="#1F8A8A"/><path d="M 105 660 l 5 6 l 10 -12" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="148" y="668" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Malformed input is a test case, not an accident</text><text x="148" y="702" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">137 tests, including truncated, corrupted and randomly mangled packets, and a</text><text x="148" y="727" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">regression test that pins ESP flow grouping against tcpdump.</text><text x="148" y="764" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#6B7688" text-anchor="start" letter-spacing="0">A parser that panics on a bad capture is a parser that is not deployed.</text><rect x="64" y="858" width="1468" height="88" rx="4" fill="#F2F5F8"/><text x="92" y="894" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#0B1017" text-anchor="start" letter-spacing="0">Compared with a protocol analyser</text><text x="92" y="922" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#2B364B" text-anchor="start" letter-spacing="0">Wireshark and tcpdump decode IKE. Neither grades a tunnel against RFC 8247, and neither proposes the configuration that would fix what it found. That gap is the product.</text></svg>